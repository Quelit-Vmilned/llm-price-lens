name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_dispatch is only allowed to deploy main; push already targets main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - run: npm audit --audit-level=low
      - name: Reject stale source before upload
        run: |
          set -euo pipefail
          latest_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" != "$latest_sha" ]; then
            echo "::error::This source is no longer main. Deploy the latest main revision."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject stale source after environment approval
        run: |
          set -euo pipefail
          latest_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" != "$latest_sha" ]; then
            echo "::error::This source is no longer main. Deploy the latest main revision."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm the published version
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deployment.mjs
