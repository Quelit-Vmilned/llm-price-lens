name: Synchronize pricing data

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh the validated snapshot even when source prices are unchanged'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pricing-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch, normalize, merge, validate and emit
        id: sync
        env:
          SYNC_FORCE: ${{ inputs.force == true }}
        run: |
          if [ "$SYNC_FORCE" = "true" ]; then
            npm run sync:data -- --force
          else
            npm run sync:data
          fi
      - if: steps.sync.outputs.changed == 'true'
        run: npm run typecheck
      - if: steps.sync.outputs.changed == 'true'
        run: npm test
      - if: steps.sync.outputs.changed == 'true'
        run: npm run build
      - if: steps.sync.outputs.changed == 'true'
        run: npm run verify:build
      - if: steps.sync.outputs.changed == 'true'
        run: npm audit --audit-level=low
      - name: Commit the successful snapshot and request guarded deployment
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.generated.json data/quality-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'data: synchronize validated model prices'
          # A concurrent main update rejects this non-fast-forward push. Do not
          # reset/rebase over new code or publish an unreviewed combination.
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not trigger push workflows. An explicit
          # dispatch runs the existing guarded build/deploy and online checks.
          gh workflow run deploy.yml --ref main
